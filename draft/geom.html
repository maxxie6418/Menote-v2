<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script>
window.addEventListener('load',()=>{
  const f=document.createElement('iframe');
  f.style.width='1360px';f.style.height='4200px';f.style.border='0';
  f.src='file:///F:/Git/Menote-v2/wiki/design.html';
  f.onload=()=>{
    const d=f.contentDocument;
    const sec=d.querySelector('#s12');
    const r=sec.getBoundingClientRect();
    const out={top:r.top+window.scrollY,height:r.height,
      demos:[...d.querySelectorAll('.sb-demo')].map(e=>{const b=e.getBoundingClientRect();return {x:b.x,y:b.top+window.scrollY,w:b.width,h:b.height,cls:e.className};})};
    document.title=JSON.stringify(out);
    document.body.innerHTML='<pre id=res>'+JSON.stringify(out,null,1)+'</pre>';
  };
  document.body.appendChild(f);
});
</script></body></html>
