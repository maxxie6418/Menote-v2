<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>新文档模板选择 · 实现稿</title>
<link rel="stylesheet" href="../src/web/src/styles/tokens.css" />
<link rel="stylesheet" href="../src/web/src/styles/app.css" />
<link rel="stylesheet" href="../src/web/src/styles/shell.css" />
<style>
  /* 方案稿专用：给文档区一个可视高度，模拟真实应用里的滚动容器 */
  .mn-doc { min-height: 34rem; }
</style>
</head>
<body>
<article class="mn-doc" aria-label="文档区" data-form="note">
  <div class="mn-docbar">
    <span class="mn-docbar-left"><span class="mn-crumb">草稿箱</span></span>
    <span class="mn-docbar-right"><span class="mn-savestate">编辑 / 预览</span></span>
  </div>
  <div class="mn-docbody">
    <textarea class="mn-doc-title" rows="1">无标题</textarea>
    <div class="mn-doc-tags">
      <svg class="mn-doc-tags-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
      <input class="mn-taginput" placeholder="加标签，回车确认" aria-label="标签" />
    </div>

    <!-- 实现稿：模板选择块（真实类名，样式取自 shell.css） -->
    <div class="mn-templatepick-wrap" role="group" aria-label="选择文档模板">
      <div class="mn-templatepick">
        <button type="button" class="mn-template" title="直接写正文，Markdown 原文">
          <span class="mn-template-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>
          <span class="mn-template-name">普通笔记</span>
        </button>
        <button type="button" class="mn-template" title="表格式整理，字段带类型">
          <span class="mn-template-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg></span>
          <span class="mn-template-name">多维表格</span>
        </button>
      </div>
    </div>

    <!-- 写作面（真实应用里在这里写；方块浮在它上方中央，点空白处直接落到这里） -->
    <div class="mn-editor-wrap">
      <p style="color:var(--app-fg-faint);font-size:var(--app-size-body);margin:0;"></p>
    </div>
  </div>
</article>
</body>
</html>
