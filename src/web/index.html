<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/icon.svg"><title>Menote</title><script>try{var m=localStorage.getItem("menote.theme")||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";}catch(e){document.documentElement.dataset.theme="light";}try{var f=localStorage.getItem("menote.font");if(f==="system")document.documentElement.dataset.font="system";}catch(e){}try{var w=localStorage.getItem("menote.measure");if(w==="wide"||w==="full")document.documentElement.dataset.measure=w;}catch(e){}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
